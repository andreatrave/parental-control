<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Parental Control – Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1565C0, #7B1FA2);
    padding: 20px;
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 44px 32px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 64px rgba(0,0,0,.28);
    text-align: center;
  }

  .icon { font-size: 52px; margin-bottom: 10px; }
  h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 28px; }

  .error {
    background: #FFEBEE;
    color: #C62828;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;
  }

  label { display: block; text-align: left; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }

  input[type=password] {
    width: 100%;
    padding: 14px;
    border: 2px solid #E0E0E0;
    border-radius: 10px;
    font-size: 16px;
    transition: border-color .2s;
    margin-bottom: 20px;
  }
  input[type=password]:focus { outline: none; border-color: #1565C0; }

  button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #1565C0, #7B1FA2);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  button:active { opacity: .88; }

  .footer { margin-top: 18px; font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Parental Control</h1>
  <p class="sub">Remote Access</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="POST" action="/login">
    <label for="pw">Parent Password</label>
    <input type="password" id="pw" name="password" placeholder="Enter your password"
           autofocus autocomplete="current-password" required>
    <button type="submit">Login</button>
  </form>

  <p class="footer">Secure · Local network only</p>
</div>
</body>
</html>
